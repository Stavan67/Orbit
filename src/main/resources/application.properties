spring.application.name=Orbit

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/satellite_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

api.security.admin.username=${API_ADMIN_USERNAME:admin}
api.security.admin.password=${API_ADMIN_PASSWORD}
api.security.operator.username=${API_OPERATOR_USERNAME:operator}
api.security.operator.password=${API_OPERATOR_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

spacetrack.username=${SPACETRACK_USERNAME}
spacetrack.password=${SPACETRACK_PASSWORD}
spacetrack.base-url=https://www.space-track.org
spacetrack.timeout.connect=30
spacetrack.timeout.read=60

tle.update.enabled=true
tle.update.cron=0 30 0 * * *
tle.max-age-days=30
tle.priority.norad.ids=16181

cdm.fetch.enabled=true

# Primary satellite: NORAD 16181 (COSMOS 1697)
conjunction.analysis.enabled=true
conjunction.analysis.cron=0 0 2 * * *
conjunction.analysis.primary.norad.ids=16181
conjunction.analysis.cooldown.minutes=60

conjunction.cleanup.cron=0 0 3 * * SUN

conjunction.prediction.days=7
conjunction.time.step.seconds=30
conjunction.min.distance.km=150.0

conjunction.filter.altitude.tolerance.km=150.0
conjunction.filter.inclination.tolerance.deg=60.0
conjunction.filter.raan.tolerance.deg=45.0
conjunction.filter.raan.enabled=true

conjunction.refinement.fine.step.seconds=1
conjunction.refinement.polish.step.seconds=0.1
conjunction.refinement.threshold.km=100.0
conjunction.refinement.window.seconds=120

conjunction.screening.batch.size=100
conjunction.screening.log.interval=100

conjunction.pc.combined.hbr.m=10.0
conjunction.pc.log.threshold=1e-6
conjunction.cdm.tca.window.hours=6

logging.level.com.orbit=INFO
logging.level.com.orbit.service.SpaceTrackService=INFO
logging.level.com.orbit.service.ConjunctionAnalysisService=INFO
logging.level.com.orbit.service.ConjunctionScreeningService=INFO
logging.level.com.orbit.service.ProbabilityOfCollisionService=INFO
logging.level.com.orbit.service.CdmIngestionService=INFO
logging.level.com.orbit.service.ConjunctionDeduplicationService=INFO