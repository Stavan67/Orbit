<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #04060f;
            --bg2:    #090d1a;
            --bg3:    #0e1422;
            --b1:     #1a2035;
            --b2:     #2a3050;
            --text:   #dde4f0;
            --dim:    #6a7a99;
            --faint:  #2a3555;
            --amber:  #f5a623;
            --amber2: #6b3e08;
            --red:    #e05252;
            --red2:   #5c1a1a;
            --yellow: #d4b84a;
            --green:  #4eca7a;
            --cyan:   #5bbbd4;
            --mono:   'IBM Plex Mono', monospace;
        }

        html, body {
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes fadeUp  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes spin    { to { transform: rotate(360deg); } }
        @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:0.2} }
        @keyframes orbitRing {
            0%   { transform: rotate(0deg)   scaleX(1)   scaleY(0.35); }
            50%  { transform: rotate(180deg) scaleX(1)   scaleY(0.35); }
            100% { transform: rotate(360deg) scaleX(1)   scaleY(0.35); }
        }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 0 0 rgba(245,166,35,0); }
            50%     { box-shadow: 0 0 14px 3px rgba(245,166,35,0.18); }
        }
        @keyframes scanline {
            0%   { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .e0 { animation: fadeUp 0.4s ease both; }
        .e1 { animation: fadeUp 0.4s 0.08s ease both; }
        .e2 { animation: fadeUp 0.4s 0.16s ease both; }
        .e3 { animation: fadeUp 0.4s 0.24s ease both; }
        .e4 { animation: fadeUp 0.4s 0.32s ease both; }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.03) 2px,
                    rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        .page {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px 64px;
            position: relative;
            z-index: 2;
        }

        .bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 0; border-bottom: 1px solid var(--b1);
            margin-bottom: 36px; position: sticky; top: 0;
            background: linear-gradient(180deg, rgba(4,6,15,0.97) 80%, transparent);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .bar-left { display: flex; align-items: center; gap: 16px; }

        .logo {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .logo-ring {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(245,166,35,0.6);
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }
        .logo-ring::before {
            content: '';
            position: absolute;
            top: -3px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px;
            background: var(--amber);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--amber);
        }
        .logo-dot {
            width: 8px; height: 8px;
            background: var(--amber);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(245,166,35,0.7);
        }

        .wm { font-size: 12px; font-weight: 600; letter-spacing: 6px; color: var(--text); }
        .wm-sub { font-size: 9px; letter-spacing: 3px; color: var(--dim); margin-top: 2px; }

        .bar-right {
            display: flex; gap: 24px; font-size: 10px;
            color: var(--dim); letter-spacing: 1px; align-items: center;
        }
        .live { color: var(--green); display: flex; align-items: center; gap: 6px; }
        .live-dot {
            width: 6px; height: 6px;
            background: var(--green); border-radius: 50%;
            box-shadow: 0 0 6px var(--green);
            animation: blink 2.5s ease-in-out infinite;
        }

        .sat-hdr {
            display: flex; justify-content: space-between; align-items: flex-end;
            padding-bottom: 22px; border-bottom: 1px solid var(--b1); margin-bottom: 28px;
        }
        .sat-id {
            font-size: 44px; font-weight: 600; letter-spacing: -2px; line-height: 1;
            background: linear-gradient(135deg, #dde4f0 40%, #6a8ab0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .sat-nm { font-size: 10px; color: var(--dim); letter-spacing: 4px; text-transform: uppercase; margin-top: 8px; }
        .meta-row { display: flex; gap: 32px; }
        .mi { text-align: right; }
        .mi-lbl { font-size: 9px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
        .mi-val { font-size: 11px; color: var(--text); margin-top: 4px; }

        .counts { display: grid; grid-template-columns: repeat(4,1fr); gap: 2px; margin-bottom: 36px; }
        .cnt {
            padding: 18px 20px;
            background: var(--bg2);
            border: 1px solid var(--b1);
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .cnt::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top left, rgba(255,255,255,0.02), transparent 70%);
            pointer-events: none;
        }
        .cnt.c { border-top: 2px solid var(--red);    }
        .cnt.h { border-top: 2px solid var(--amber);  }
        .cnt.m { border-top: 2px solid var(--yellow); }
        .cnt.t { border-top: 2px solid var(--b2);     }
        .cnt.c:hover { border-color: var(--red2);    border-top-color: var(--red); }
        .cnt.h:hover { border-color: var(--amber2);  border-top-color: var(--amber); }
        .cnt-n {
            font-size: 36px; font-weight: 600; line-height: 1;
            animation: countUp 0.5s ease both;
        }
        .cnt.c .cnt-n { color: var(--red);    text-shadow: 0 0 20px rgba(224,82,82,0.4); }
        .cnt.h .cnt-n { color: var(--amber);  text-shadow: 0 0 20px rgba(245,166,35,0.4); }
        .cnt.m .cnt-n { color: var(--yellow); }
        .cnt.t .cnt-n { color: var(--faint);  }
        .cnt-l { font-size: 9px; letter-spacing: 3px; color: var(--dim); margin-top: 6px; text-transform: uppercase; }

        .sec {
            font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--dim);
            display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
        }
        .sec::after { content: ''; flex: 1; height: 1px; background: var(--b1); }
        .sec.sc { color: var(--red); }
        .sec.sh { color: var(--amber); }
        .sec.sm { color: var(--yellow); }

        .pc {
            background: linear-gradient(135deg, rgba(92,26,26,0.15), var(--bg2) 60%);
            border: 1px solid var(--red2);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }
        .pc::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--red), rgba(224,82,82,0.3) 60%, transparent);
        }
        .pc::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .pc-inner { display: grid; grid-template-columns: 1fr 175px; position: relative; z-index: 1; }
        .pc-body { padding: 26px 30px; }
        .pc-flag {
            font-size: 8px; letter-spacing: 3px; font-weight: 600; color: var(--red);
            border: 1px solid var(--red2); padding: 3px 8px; display: inline-block;
            background: rgba(224,82,82,0.07); margin-bottom: 16px;
        }
        .pc-pair { font-size: 22px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; }
        .pc-names { font-size: 11px; color: var(--dim); margin-bottom: 24px; }
        .pc-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; }
        .ml { font-size: 8px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
        .mv { font-size: 22px; font-weight: 500; line-height: 1; }
        .mv.dr { color: var(--red); text-shadow: 0 0 16px rgba(224,82,82,0.5); }
        .mv.am { color: var(--amber); }
        .mu { font-size: 10px; color: var(--dim); margin-left: 3px; }

        .pc-side {
            padding: 26px 20px; border-left: 1px solid var(--b1);
            display: flex; flex-direction: column; gap: 20px; justify-content: center;
        }
        .sl { font-size: 8px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
        .sd { font-size: 11px; color: var(--dim); }
        .st { font-size: 13px; font-weight: 500; margin-top: 3px; }
        .sc2 { font-size: 13px; color: var(--amber); font-weight: 500; margin-top: 8px; }

        .sb { font-size: 8px; letter-spacing: 1.5px; padding: 3px 8px; border: 1px solid; display: inline-block; }
        .sb.tle { border-color: #1a3d27; color: var(--green); }
        .sb.cdm { border-color: #163040; color: var(--cyan); }
        .sb.cdo { border-color: var(--amber2); color: var(--amber); }

        .tbl-wrap {
            margin-bottom: 32px;
            border: 1px solid var(--b1);
            overflow: hidden;
        }
        .tbl { width: 100%; border-collapse: collapse; }
        .tbl th {
            font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--dim); font-weight: 400;
            padding: 10px 12px; border-bottom: 1px solid var(--b1);
            text-align: left; white-space: nowrap;
            background: rgba(10,14,30,0.6);
        }
        .tbl td { padding: 12px 12px; border-bottom: 1px solid rgba(26,32,53,0.8); vertical-align: middle; }
        .tbl tr:last-child td { border-bottom: none; }
        .tbl tr { background: var(--bg2); transition: background 0.15s; }
        .tbl tr:hover { background: var(--bg3); }
        .nc.sc { color: var(--red); } .nc.sh { color: var(--amber); } .nc.sm { color: var(--yellow); }
        .nc { font-weight: 600; }
        .dc { color: var(--dim); font-size: 11px; }
        .vr { color: var(--red); } .va { color: var(--amber); }
        .pill { font-size: 8px; letter-spacing: 1.5px; padding: 3px 8px; border: 1px solid; display: inline-block; }
        .pill.sc { border-color: var(--red2);   color: var(--red); }
        .pill.sh { border-color: var(--amber2); color: var(--amber); }
        .pill.sm { border-color: #4a3a10;       color: var(--yellow); }

        .ctr {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 50vh; gap: 18px;
        }
        .sp {
            width: 30px; height: 30px;
            border: 1px solid var(--b2); border-top-color: var(--amber);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .ct { font-size: 10px; color: var(--dim); letter-spacing: 3px; }
        .eb {
            padding: 28px 32px; border: 1px solid var(--red2);
            max-width: 480px; text-align: center;
            background: linear-gradient(135deg, rgba(92,26,26,0.1), transparent);
        }
        .et { font-size: 11px; color: var(--red); letter-spacing: 3px; margin-bottom: 10px; }
        .em { font-size: 11px; color: var(--dim); line-height: 2.0; }
        .rb {
            margin-top: 16px; padding: 9px 20px;
            background: transparent; border: 1px solid var(--b2);
            color: var(--dim); cursor: pointer;
            font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
            transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .rb:hover { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 12px rgba(245,166,35,0.15); }
        .en {
            padding: 36px 20px; border: 1px dashed var(--b1);
            color: var(--dim); font-size: 11px; text-align: center; line-height: 2.4;
        }

        .ft {
            border-top: 1px solid var(--b1); padding: 16px 0;
            display: flex; justify-content: space-between;
            font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-top: 16px;
        }

        @media (max-width: 760px) {
            .pc-inner { grid-template-columns: 1fr; }
            .pc-side { border-left: none; border-top: 1px solid var(--b1); flex-direction: row; flex-wrap: wrap; gap: 16px; }
            .pc-metrics { grid-template-columns: repeat(2,1fr); }
            .sat-hdr { flex-direction: column; align-items: flex-start; gap: 16px; }
            .meta-row { flex-wrap: wrap; gap: 14px; }
            .mi { text-align: left; }
            .bar-right { display: none; }
            .tbl th:nth-child(5), .tbl td:nth-child(5),
            .tbl th:nth-child(7), .tbl td:nth-child(7) { display: none; }
            .counts { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="page" id="root"></div>

<script>
    (function(){
        const canvas = document.getElementById('starfield');
        const ctx    = canvas.getContext('2d');

        let W, H;
        const STAR_COUNT    = 320;
        const SHOOTER_MAX   = 5;

        const stars = [];
        function initStars(){
            stars.length = 0;
            for(let i=0;i<STAR_COUNT;i++){
                stars.push({
                    x: Math.random()*W,
                    y: Math.random()*H,
                    r: Math.random()*1.1+0.2,
                    a: Math.random()*0.7+0.1,
                    phase: Math.random()*Math.PI*2,
                    speed: Math.random()*0.008+0.003
                });
            }
        }

        const shooters = [];
        function spawnShooter(){
            if(shooters.length >= SHOOTER_MAX) return;
            const fromTop = Math.random() < 0.6;
            const x = fromTop ? Math.random()*W : 0;
            const y = fromTop ? 0 : Math.random()*H*0.5;
            const angle = (Math.random()*30+15) * Math.PI/180;
            const speed = Math.random()*6+4;
            const length = Math.random()*220+120;
            const life   = length/speed;
            const palette = ['255,255,255','245,166,35','91,187,212'];
            const col = palette[Math.random()<0.8 ? 0 : Math.random()<0.5 ? 1 : 2];
            shooters.push({ x, y,
                vx: Math.cos(angle)*speed,
                vy: Math.sin(angle)*speed,
                len: length,
                col, life, age:0,
                trail: []
            });
        }

        function resize(){
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resize);
        resize();

        function scheduleShooter(){
            setTimeout(()=>{
                spawnShooter();
                scheduleShooter();
            }, Math.random()*3200+800);
        }
        scheduleShooter();
        setTimeout(spawnShooter, 600);
        setTimeout(spawnShooter, 1400);

        let last = 0;
        function draw(ts){
            const dt = Math.min((ts-last)/16.67, 3);
            last = ts;

            ctx.clearRect(0,0,W,H);

            const grad = ctx.createRadialGradient(W*0.5,H*0.35,0, W*0.5,H*0.35,W*0.75);
            grad.addColorStop(0,   'rgba(10,18,45,0.55)');
            grad.addColorStop(0.5, 'rgba(4,8,20,0.35)');
            grad.addColorStop(1,   'rgba(2,4,10,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,H);

            const now = ts/1000;
            for(const s of stars){
                const twinkle = s.a * (0.6 + 0.4*Math.sin(now*s.speed*60 + s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(200,220,255,${twinkle})`;
                ctx.fill();
            }

            for(let i=shooters.length-1; i>=0; i--){
                const s = shooters[i];
                s.age += dt;
                if(s.age >= s.life){ shooters.splice(i,1); continue; }

                s.trail.push({x:s.x, y:s.y});
                if(s.trail.length > 28) s.trail.shift();

                s.x += s.vx*dt;
                s.y += s.vy*dt;

                const progress = s.age/s.life;
                const fade = progress < 0.15
                    ? progress/0.15
                    : progress > 0.6
                        ? 1-(progress-0.6)/0.4
                        : 1;

                if(s.trail.length > 1){
                    const tail = s.trail[0];
                    const head = s.trail[s.trail.length-1];
                    const tg = ctx.createLinearGradient(tail.x,tail.y,head.x,head.y);
                    tg.addColorStop(0,   `rgba(${s.col},0)`);
                    tg.addColorStop(0.6, `rgba(${s.col},${0.25*fade})`);
                    tg.addColorStop(1,   `rgba(${s.col},${0.9*fade})`);
                    ctx.beginPath();
                    ctx.moveTo(s.trail[0].x, s.trail[0].y);
                    for(let j=1;j<s.trail.length;j++){
                        ctx.lineTo(s.trail[j].x, s.trail[j].y);
                    }
                    ctx.strokeStyle = tg;
                    ctx.lineWidth   = 1.4;
                    ctx.stroke();
                }

                const hg = ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,5);
                hg.addColorStop(0,   `rgba(${s.col},${0.95*fade})`);
                hg.addColorStop(0.4, `rgba(${s.col},${0.4*fade})`);
                hg.addColorStop(1,   `rgba(${s.col},0)`);
                ctx.beginPath();
                ctx.arc(s.x, s.y, 5, 0, Math.PI*2);
                ctx.fillStyle = hg;
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    })();
</script>

<script type="text/babel">
    const { useState, useEffect } = React;

    const NORAD = 1245;

    const tca = s => {
        if (!s) return { d:'—', t:'—' };
        const dt = new Date(s.includes('Z') ? s : s+'Z');
        return {
            d: dt.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric',timeZone:'UTC'}),
            t: dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'UTC',hour12:false})+' UTC'
        };
    };
    const hrs  = h => { if(h==null) return '—'; if(h<0) return 'ELAPSED'; if(h<1) return Math.round(h*60)+'m'; if(h<24) return h.toFixed(1)+'h'; return (h/24).toFixed(1)+'d'; };
    const pc   = (v,d) => (!v||v===0)?'~0':(d||v.toExponential(3));
    const miss = m => m==null?'—':m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
    const vel  = v => v==null?'—':(v/1000).toFixed(2)+' km/s';

    function apiFetch(url) {
        return fetch(url).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        });
    }

    function Src({s,c}){
        if(s==='CDM_ONLY') return <span className="sb cdo">CDM ONLY</span>;
        if(c) return <span className="sb cdm">CDM CONFIRMED</span>;
        return <span className="sb tle">TLE SCREENED</span>;
    }

    function Primary({ev, primaryName}){
        const t=tca(ev.tca);
        return <div className="pc e2">
            <div className="pc-inner">
                <div className="pc-body">
                    <div className="pc-flag">HIGHEST COLLISION RISK</div>
                    <div className="pc-pair">{NORAD} &nbsp;↔&nbsp; {ev.secondaryNorad}</div>
                    <div className="pc-names">{primaryName||NORAD} &nbsp;/&nbsp; {ev.secondaryName||ev.secondaryNorad}</div>
                    <div className="pc-metrics">
                        <div><div className="ml">Miss Distance</div><div className="mv dr">{ev.missDistanceM!=null?Math.round(ev.missDistanceM):'—'}<span className="mu">m</span></div></div>
                        <div><div className="ml">Collision Pc</div><div className="mv dr">{pc(ev.probabilityOfCollision,ev.pcDisplay)}</div></div>
                        <div><div className="ml">Rel. Velocity</div><div className="mv am">{ev.relativeVelocityMs!=null?(ev.relativeVelocityMs/1000).toFixed(2):'—'}<span className="mu">km/s</span></div></div>
                        <div><div className="ml">Time to TCA</div><div className="mv am">{hrs(ev.hoursToTca)}</div></div>
                    </div>
                </div>
                <div className="pc-side">
                    <div>
                        <div className="sl">Time of Closest Approach</div>
                        <div className="sd">{t.d}</div>
                        <div className="st">{t.t}</div>
                        <div className="sc2">{hrs(ev.hoursToTca)}</div>
                    </div>
                    <div><div className="sl">Detection</div><Src s={ev.detectionSource} c={ev.cdmBased}/></div>
                </div>
            </div>
        </div>;
    }

    function Table({evs}){
        if(!evs||!evs.length) return null;
        return <div className="tbl-wrap">
            <table className="tbl">
                <thead><tr>
                    <th>NORAD</th><th>NAME</th><th>MISS DIST</th><th>COLLISION Pc</th>
                    <th>REL. VEL</th><th>TCA</th><th>T−TCA</th><th>RISK</th><th>SRC</th>
                </tr></thead>
                <tbody>{evs.map(ev=>{
                    const r=ev.riskLevel.toLowerCase(), t=tca(ev.tca);
                    const pcv=ev.probabilityOfCollision||0;
                    const mc=ev.missDistanceM<1000?'vr':ev.missDistanceM<5000?'va':'';
                    const pcc=pcv>=1e-4?'vr':pcv>=1e-6?'va':'';
                    return <tr key={ev.eventId}>
                        <td className={`nc s${r[0]}`}>{ev.secondaryNorad}</td>
                        <td className="dc">{ev.secondaryName||'—'}</td>
                        <td className={mc}>{miss(ev.missDistanceM)}</td>
                        <td className={pcc}>{pc(ev.probabilityOfCollision,ev.pcDisplay)}</td>
                        <td>{vel(ev.relativeVelocityMs)}</td>
                        <td className="dc">{t.d} {t.t}</td>
                        <td>{hrs(ev.hoursToTca)}</td>
                        <td><span className={`pill s${r[0]}`}>{ev.riskLevel}</span></td>
                        <td><Src s={ev.detectionSource} c={ev.cdmBased}/></td>
                    </tr>;
                })}</tbody>
            </table>
        </div>;
    }

    function App() {
        const [data,    setData]    = useState(null);
        const [loading, setLoading] = useState(true);
        const [error,   setError]   = useState(null);
        const [ts,      setTs]      = useState('');

        const load = () => {
            setLoading(true); setError(null);
            apiFetch(`/api/conjunction/dashboard/${NORAD}`)
                .then(d => { setData(d); setTs(new Date().toUTCString().replace(' GMT',' UTC')); setLoading(false); })
                .catch(e => { setError(e.message); setLoading(false); });
        };
        useEffect(load, []);

        const all    = data ? [...(data.events?.critical||[]),...(data.events?.high||[]),...(data.events?.medium||[])] : [];
        const sorted = [...all].sort((a,b)=>(a.missDistanceM||Infinity)-(b.missDistanceM||Infinity));
        const pri    = sorted[0] || null;
        const oc     = (data?.events?.critical||[]).filter(e=>e!==pri);
        const hi     = data?.events?.high   || [];
        const me     = data?.events?.medium || [];

        return <>
            <div className="bar e0">
                <div className="bar-left">
                    <div className="logo">
                        <div className="logo-ring"/>
                        <div className="logo-dot"/>
                    </div>
                    <div><div className="wm">ORBIT</div><div className="wm-sub">CONJUNCTION MONITOR</div></div>
                </div>
                <div className="bar-right">
                    {ts && <span>{ts}</span>}
                    <span className="live"><span className="live-dot"/>LIVE</span>
                </div>
            </div>

            {loading && <div className="ctr"><div className="sp"/><div className="ct">ACQUIRING DATA...</div></div>}

            {error && <div className="ctr"><div className="eb">
                <div className="et">CONNECTION ERROR</div>
                <div className="em">Could not reach API: {error}<br/>The backend may be starting up — please wait a moment and retry.</div>
                <button className="rb" onClick={load}>RETRY</button>
            </div></div>}

            {!loading && !error && data && <>
                <div className="sat-hdr e1">
                    <div>
                        <div className="sat-id">{data.primaryNorad||NORAD}</div>
                        <div className="sat-nm">{data.primaryName||`NORAD ${NORAD}`}</div>
                    </div>
                    <div className="meta-row">
                        <div className="mi"><div className="mi-lbl">Analysis Epoch</div><div className="mi-val">{data.generatedAt?new Date(data.generatedAt+'Z').toUTCString().replace(' GMT',''):'—'}</div></div>
                        <div className="mi"><div className="mi-lbl">Screening Window</div><div className="mi-val">7-DAY FORWARD</div></div>
                        <div className="mi"><div className="mi-lbl">Objects Screened</div><div className="mi-val">30,000+</div></div>
                    </div>
                </div>

                <div className="counts e1">
                    <div className="cnt c"><div className="cnt-n">{data.counts?.critical??0}</div><div className="cnt-l">CRITICAL</div></div>
                    <div className="cnt h"><div className="cnt-n">{data.counts?.high??0}</div><div className="cnt-l">HIGH</div></div>
                    <div className="cnt m"><div className="cnt-n">{data.counts?.medium??0}</div><div className="cnt-l">MEDIUM</div></div>
                    <div className="cnt t"><div className="cnt-n">{data.counts?.total??0}</div><div className="cnt-l">TOTAL</div></div>
                </div>

                {all.length===0 && <div className="en e2">
                    No conjunction events found in database.<br/>
                    Analysis runs daily at 02:00 UTC via scheduled job.
                </div>}

                {pri && <><div className="sec sc e2">PRIMARY THREAT</div><Primary ev={pri} primaryName={data.primaryName}/></>}
                {oc.length>0 && <><div className="sec sc e3">CRITICAL — ADDITIONAL</div><Table evs={oc}/></>}
                {hi.length>0 && <><div className="sec sh e3">HIGH RISK</div><Table evs={hi}/></>}
                {me.length>0 && <><div className="sec sm e4">MEDIUM RISK</div><Table evs={me}/></>}
            </>}

            <div className="ft">
                <span>SGP4 / OREKIT · FOSTER 2D Pc · PUBLIC TLE CATALOG</span>
                <span>DATA: SPACE-TRACK.ORG</span>
            </div>
        </>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
